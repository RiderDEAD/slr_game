<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slay the Spire II: TMA Edition</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #0f0f11; color: #e2e2e6;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            user-select: none; overflow: hidden;
        }
        #menu, #game {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; width: 100vw; position: absolute; transition: all 0.5s ease;
        }
        .hidden { display: none !important; opacity: 0; }
        
        h1 {
            color: #ff4757; text-shadow: 0 0 15px rgba(255,71,87,0.6);
            font-size: 2.8rem; margin-bottom: 5px; font-weight: 900; letter-spacing: 2px;
        }
        .subtitle { color: #888; margin-bottom: 30px; font-size: 1rem; }
        
        .btn {
            background: #1e222b; color: white; border: 2px solid #4b5563;
            padding: 14px 35px; font-size: 1.1rem; border-radius: 10px;
            cursor: pointer; margin: 8px; transition: all 0.2s ease; font-weight: 600;
        }
        .btn:hover { background: #ff4757; border-color: #ff6b81; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,71,87,0.4); }
        
        /* Выбор персонажа */
        .char-select { display: flex; gap: 20px; margin-bottom: 25px; }
        .char-card {
            background: #15161e; border: 2px solid #2d3142;
            padding: 20px; border-radius: 14px; cursor: pointer;
            text-align: center; width: 130px; transition: all 0.3s ease;
        }
        .char-card:hover { border-color: #57606f; transform: scale(1.02); }
        .char-card.selected { border-color: #ff4757; background: #261b21; box-shadow: 0 0 15px rgba(255,71,87,0.2); }

        /* Игровой экран */
        .battlefield { display: flex; justify-content: space-around; width: 95%; max-width: 800px; margin-bottom: 20px; }
        .entity { background: #13141c; padding: 20px; border-radius: 16px; width: 42%; text-align: center; border: 1px solid #232733; position: relative; }
        .hp-container { background: #222; border-radius: 8px; overflow: hidden; margin-top: 10px; border: 1px solid #333; }
        .hp-bar { background: linear-gradient(90deg, #ff4757, #ff6b81); height: 14px; width: 100%; transition: width 0.4s cubic-bezier(0.12, 0, 0.39, 0); }
        .block-badge { background: #1e90ff; color: white; padding: 3px 9px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; position: absolute; top: 15px; right: 15px; box-shadow: 0 0 10px rgba(30,144,255,0.5); }

        /* Реликвии */
        .relics-bar { display: flex; gap: 12px; margin-bottom: 20px; background: #13141c; padding: 12px 20px; border-radius: 10px; width: 85%; max-width: 760px; border: 1px solid #232733; }
        .relic { background: #ffa502; color: #121214; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; box-shadow: 0 0 8px rgba(255,165,2,0.4); }

        /* Рука игрока и карты */
        .hand { display: flex; gap: 15px; justify-content: center; width: 100%; position: absolute; bottom: 40px; height: 160px; }
        .card {
            background: linear-gradient(135deg, #2c3e50, #34495e); border: 2px solid #7f8c8d;
            width: 110px; height: 150px; border-radius: 12px; padding: 12px; cursor: pointer;
            display: flex; flex-direction: column; justify-content: space-between; font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            animation: cardSpawn 0.4s ease-out forwards;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .card:hover { transform: translateY(-25px) scale(1.08) rotate(2deg); box-shadow: 0 15px 25px rgba(0,0,0,0.6); border-color: #fff; }
        .card.attack { background: linear-gradient(135deg, #962d22, #c0392b); border-color: #e74c3c; }
        .card.skill { background: linear-gradient(135deg, #1f4068, #162447); border-color: #1e90ff; }
        .card.talent { background: linear-gradient(135deg, #d35400, #e67e22); border-color: #f39c12; }
        .card-cost { background: rgba(0,0,0,0.3); border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.4); }

        .log { background: rgba(0,0,0,0.5); padding: 12px; border-radius: 8px; width: 85%; max-width: 760px; text-align: center; border: 1px solid #1c1e26; color: #ffa502; font-weight: 500; }

        @keyframes cardSpawn {
            from { transform: translateY(150px) scale(0.5); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>SLAY THE SPIRE II</h1>
        <div class="subtitle">Telegram TMA Edition Prototype</div>
        
        <div class="char-select">
            <div class="char-card selected" id="char-kram" onclick="selectChar('KRAM', 80)">
                <h3>KRAM</h3>
                <p style="color: #ff4757; font-size: 0.85rem; margin: 5px 0 0 0;">HP: 80 | Силач</p>
            </div>
            <div class="char-card" id="char-hana" onclick="selectChar('HANA', 65)">
                <h3>HANA</h3>
                <p style="color: #1e90ff; font-size: 0.85rem; margin: 5px 0 0 0;">HP: 65 | Ловкач</p>
            </div>
        </div>
        
        <button class="btn" onclick="startGame()">ИГРАТЬ</button>
        <button class="btn" onclick="showAuthors()">АВТОРЫ</button>
    </div>

    <div id="game" class="hidden">
        <div class="relics-bar">
            <span style="color: #777; font-size: 0.85rem; align-self: center;">Реликвии:</span>
            <div class="relic">Вечное Перо (+2 к Атакам)</div>
        </div>

        <div class="battlefield">
            <div class="entity">
                <div class="block-badge" id="p-block">0</div>
                <h3 id="p-name">KRAM</h3>
                <div>HP: <span id="p-hp-text">80/80</span></div>
                <div class="hp-container"><div class="hp-bar" id="p-hp-bar"></div></div>
            </div>
            <div class="entity">
                <div class="block-badge" id="e-block">0</div>
                <h3>Босс HANA</h3>
                <div>HP: <span id="e-hp-text">70/70</span></div>
                <div class="hp-container"><div class="hp-bar" id="e-hp-bar"></div></div>
            </div>
        </div>

        <div class="log" id="combat-log">Ваш ход! Выберите карту для разыгрывания.</div>

        <div class="hand" id="hand"></div>
    </div>

    <script>
        let player = { name: "KRAM", hp: 80, maxHp: 80, block: 0, dmgBonus: 2 };
        let enemy = { name: "Босс HANA", hp: 70, maxHp: 70, block: 0 };
        
        // Карты в пуле игры
        const baseDeck = [
            { name: "Удар", type: "attack", cost: 1, desc: "Наносит 6 урона", action: () => castAttack(6) },
            { name: "Защита", type: "skill", cost: 1, desc: "Дает 5 брони", action: () => castBlock(5) },
            { name: "Firestorm", type: "talent", cost: 2, desc: "Талант: +3 к атакам", action: () => castTalent() }
        ];

        function selectChar(name, hp) {
            player.name = name; player.hp = hp; player.maxHp = hp;
            document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
            if(name === 'KRAM') document.getElementById('char-kram').classList.add('selected');
            else document.getElementById('char-hana').classList.add('selected');
        }

        function showAuthors() {
            // ВСТАВЬ СВОИ ДАННЫЕ СЮДА:
            alert("Исполнитель: Икрам\nГруппа: ТВОЯ-ГРУППА\nУниверситет: ТВОЙ ВУЗ\nПроект: Мобильный прототип STS2 через Telegram WebApp");
        }

        function startGame() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');
            updateUI();
            drawHand();
        }

        function updateUI() {
            document.getElementById('p-name').innerText = player.name;
            document.getElementById('p-hp-text').innerText = `${player.hp}/${player.maxHp}`;
            document.getElementById('p-hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
            document.getElementById('p-block').innerText = player.block;

            document.getElementById('e-hp-text').innerText = `${enemy.hp}/${enemy.maxHp}`;
            document.getElementById('e-hp-bar').style.width = `${(enemy.hp / enemy.maxHp) * 100}%`;
            document.getElementById('e-block').innerText = enemy.block;
        }

        function drawHand() {
            const hand = document.getElementById('hand');
            hand.innerHTML = '';
            for(let i=0; i<3; i++) {
                let current = baseDeck[Math.floor(Math.random() * baseDeck.length)];
                let cardHtml = document.createElement('div');
                cardHtml.className = `card ${current.type}`;
                cardHtml.innerHTML = `<div class="card-cost">${current.cost}</div><b style="margin-top:5px;">${current.name}</b><p style="font-size:0.75rem; text-align:center;">${current.desc}</p>`;
                
                cardHtml.onclick = () => {
                    current.action();
                    cardHtml.remove();
                    if (enemy.hp > 0) setTimeout(enemyTurn, 800);
                };
                hand.appendChild(cardHtml);
            }
        }

        function castAttack(dmg) {
            let finalDmg = dmg + player.dmgBonus; // Добавляем урон от реликвии
            if(enemy.block > 0) {
                if(finalDmg <= enemy.block) { enemy.block -= finalDmg; finalDmg = 0; }
                else { finalDmg -= enemy.block; enemy.block = 0; }
            }
            enemy.hp = Math.max(0, enemy.hp - finalDmg);
            document.getElementById('combat-log').innerText = `⚔️ Вы сыграли Атаку! Нанесено ${dmg} (+2 от Реликвии) урона!`;
            updateUI();
            checkGameState();
        }

        function castBlock(blockVal) {
            player.block += blockVal;
            document.getElementById('combat-log').innerText = `🛡️ Навык активирован! Получено +${blockVal} брони.`;
            updateUI();
        }

        function castTalent() {
            player.dmgBonus += 3;
            document.getElementById('combat-log').innerText = `⚡ Разыгран Талант! Урон всех будущих атак повышен на +3!`;
            updateUI();
        }

        function enemyTurn() {
            if(enemy.hp <= 0) return;
            let enemyDmg = Math.floor(Math.random() * 5) + 6; // 6-10 урона
            if(player.block > 0) {
                if(enemyDmg <= player.block) { player.block -= enemyDmg; enemyDmg = 0; }
                else { enemyDmg -= player.block; player.block = 0; }
            }
            player.hp = Math.max(0, player.hp - enemyDmg);
            document.getElementById('combat-log').innerText = `👹 Ход Врага: он бьет вас на ${enemyDmg} урона!`;
            updateUI();
            
            if(player.hp <= 0) {
                alert("💀 Геймовер! Вы проиграли. Попробуем еще раз?");
                location.reload();
            }
            if(document.getElementById('hand').children.length === 0) {
                setTimeout(drawHand, 400);
            }
        }

        function checkGameState() {
            if(enemy.hp <= 0) {
                alert("🎉 ПОБЕДА! Босс повержен, проект защищен на отлично!");
                location.reload();
            }
        }
    </script>
</body>
</html>
